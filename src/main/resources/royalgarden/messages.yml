milestone-broadcast: "&6%player% &freached &6%crop_name% &e%tier_roman%&f!"
milestone-maxed: "max"

# ── Garden Levels ────────────────────────────────────────────────────────────
# Placeholders: %level% %level_roman% %max_level% %xp% %next% %remaining% %percent% %bar%
