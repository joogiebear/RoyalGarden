# ── Crop Milestones ──────────────────────────────────────────────────────────
# %crop_name% %tier% %tier_roman% %max_tier% %total% %next% %remaining% %percent% %bar%
milestone-progress: "&6%crop_name% &e%total% &7/ &e%next%"
