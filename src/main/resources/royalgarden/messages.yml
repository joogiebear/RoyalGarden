# ═══════════════════════════════════════════════════════════════════════════════
#  RoyalGarden  ·  messages.yml
# ═══════════════════════════════════════════════════════════════════════════════
#  Every line a player can read. & colour codes and &#rrggbb hex work.
#  Set a message to "" to switch it off.
#  Placeholders are listed next to the messages that have them.
#  Missing keys fall back to the shipped text, so updates never leave a blank.
# ═══════════════════════════════════════════════════════════════════════════════

prefix: "&2&lGarden &8» &r"

# ── Going to your Garden ─────────────────────────────────────────────────────
garden-opening: "&7Opening your Garden…"
