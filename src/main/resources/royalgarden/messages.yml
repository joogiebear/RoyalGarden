level-xp-gained: "&a+%amount% Garden XP &7(%reason%) &8| &fLevel %level% &7%percent%%"
level-source-milestone: "milestone"
level-source-unlock: "new plot"
level-source-command: "reward"
# Also %reached% %reached_roman% %player%
level-up: "&a&lGARDEN LEVEL UP! &fYour Garden is now level &a%reached%&f."
level-broadcast: "&a%player%&f's Garden reached level &a%reached%&f!"
level-maxed: "max"
# /garden level. Also %player%.
level-info: "&f%player%'s Garden: &alevel %level%&7/%max_level% &8| &f%xp% XP &8| &7next at %next%\n%bar% &7%percent%%"
# %plot% %required% %level%
unlock-garden-level: "&cPlot &f%plot%&c needs Garden level &a%required%&c — yours is %level%."
# %preset% %required%
