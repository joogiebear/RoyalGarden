name: Build

# Compile on every push/PR to main, so an unresolved dependency or a broken build
# is caught here rather than on the next deploy.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # RoyalSkyblock is not published to any Maven repository, so the host this extension
      # compiles against has to be built from source. It is a public repo, so the default token
      # is enough and no secret is involved.
      #
      # eco and paper-api are NOT handled this way: they come from repo.auxilor.io and
      # repo.papermc.io as published artifacts. Installing the shipped, shaded jars instead would
      # shadow the published ones — the local repository wins over remote — and the failure then
      # looks like the published artifact being broken.
      - name: Check out RoyalSkyblock
        uses: actions/checkout@v7
        with:
          repository: joogiebear/RoyalSkyblock
          path: royalskyblock

      # The installed version is the host's own, and it is handed to the build below as
      # -Droyalskyblock.version so the pom's default never decides what CI compiles against.
      # This matters more than it looks: setup-java's Maven cache restores ~/.m2, so a version
      # left behind by an older run stays resolvable long after the host has moved on. A stale
      # pin therefore did not fail — it quietly compiled against the previous host's API and
      # went green, which surfaces as NoSuchMethodError on a server rather than as a red build.
      - name: Build and install RoyalSkyblock
        id: host
        working-directory: royalskyblock
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew build --no-daemon
          HOST_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          LIBREFORGE_VERSION=$(grep '^libreforge-version=' gradle.properties | cut -d= -f2)
          echo "Host version: $HOST_VERSION, libreforge $LIBREFORGE_VERSION"
          echo "version=$HOST_VERSION" >> "$GITHUB_OUTPUT"
          echo "libreforge=$LIBREFORGE_VERSION" >> "$GITHUB_OUTPUT"
          mvn -q -B install:install-file \
            -Dfile=build/libs/RoyalSkyblock.jar \
            -DgroupId=com.mystipixel \
            -DartifactId=royalskyblock \
            -Dversion="$HOST_VERSION" \
            -Dpackaging=jar

      - name: Build
        # libreforge is pinned to the host's own version for the same reason the host is: an extension
        # holds libreforge objects the host created, so the two must agree on its API.
        run: >-
          mvn -B clean package
          -Droyalskyblock.version=${{ steps.host.outputs.version }}
          -Dlibreforge.version=${{ steps.host.outputs.libreforge }}

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: RoyalGarden
          path: target/RoyalGarden.jar
          if-no-files-found: error
