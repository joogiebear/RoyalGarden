name: Manual Release

# Releases only when started manually from GitHub Actions. Version format: YEAR.ISOWEEK.PATCH.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even when there are no new commits since the last tag'
        type: boolean
        default: false

concurrency:
  group: weekly-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compute version and changelog
        id: prep
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

          git fetch --tags --force
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Last tag: ${LAST_TAG:-<none>}"
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi

          # New commits since the last release, excluding release chores.
          NEW=$(git log $RANGE --no-merges --pretty=format:'%s' | grep -v -E '^chore\(release\)' || true)
          if [ -z "$NEW" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "No new commits since ${LAST_TAG:-start} - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

          # Calendar version: YEAR.ISOWEEK.PATCH, matching the rest of the suite.
          # %G is the year the ISO week belongs to; %Y would give 2027.53 on 1 Jan 2027.
          YEAR=$(TZ=America/Chicago date +%G)
          WEEK=$(( 10#$(TZ=America/Chicago date +%V) ))
          PATCH=0
          LATEST_THIS_WEEK=$(git tag -l "${YEAR}.${WEEK}.*" | sort -V | tail -1 || true)
          if [ -n "$LATEST_THIS_WEEK" ]; then
            PATCH=$(( ${LATEST_THIS_WEEK##*.} + 1 ))
          fi
          VERSION="${YEAR}.${WEEK}.${PATCH}"
          echo "New version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Release notes (this version) + prepend to the running CHANGELOG.md
          python3 .github/release/changelog.py "$VERSION" "$RANGE" > RELEASE_NOTES.md
          touch CHANGELOG.md
          cat RELEASE_NOTES.md CHANGELOG.md > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md

      - name: Set pom version
        if: steps.prep.outputs.release == 'true'
        run: mvn -B versions:set -DnewVersion=${{ steps.prep.outputs.version }} -DgenerateBackupPoms=false

      # Same reasoning as build.yml: RoyalSkyblock is not published to any Maven repository, so the
      # host this extension compiles against is built from source and installed locally. It is a
      # public repo, so the default token is enough and no secret is involved.
      #
      # The installed version is handed to the build as -Droyalskyblock.version, so the pom default
      # never decides what a release is compiled against. A release is exactly when that default
      # would otherwise be stale — the host had to move for there to be anything to release — and
      # the Maven cache would hide it, keeping the old artifact resolvable and the build green.
      # Release consumers against a published host tag, never a moving default-branch checkout.
      # Release the host first so this resolves its new tag. A failed/new host build cannot silently
      # become an extension's runtime dependency; compilation against the pinned release must pass.
      - name: Resolve published RoyalSkyblock release
        if: steps.prep.outputs.release == 'true'
        id: host_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HOST_TAG=$(gh release view --repo joogiebear/RoyalSkyblock --json tagName --jq .tagName)
          [[ "$HOST_TAG" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid host release tag'; exit 1; }
          echo "ref=refs/tags/$HOST_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out RoyalSkyblock
        if: steps.prep.outputs.release == 'true'
        uses: actions/checkout@v7
        with:
          repository: joogiebear/RoyalSkyblock
          ref: ${{ steps.host_release.outputs.ref }}
          path: royalskyblock

      - name: Build and install RoyalSkyblock
        if: steps.prep.outputs.release == 'true'
        id: host
        working-directory: royalskyblock
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew build --no-daemon
          HOST_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "Host version: $HOST_VERSION"
          echo "version=$HOST_VERSION" >> "$GITHUB_OUTPUT"
          mvn -q -B install:install-file \
            -Dfile=build/libs/RoyalSkyblock.jar \
            -DgroupId=com.mystipixel \
            -DartifactId=royalskyblock \
            -Dversion="$HOST_VERSION" \
            -Dpackaging=jar

      - name: Build
        if: steps.prep.outputs.release == 'true'
        run: mvn -B verify -Droyalskyblock.version=${{ steps.host.outputs.version }}

      - name: Locate and name jar
        if: steps.prep.outputs.release == 'true'
        id: jar
        run: |
          set -euo pipefail
          JAR=$(ls target/*.jar | grep -v -E 'original-|-sources|-javadoc' | head -1)
          VJAR="${{ steps.prep.outputs.artifact_id }}-${{ steps.prep.outputs.version }}.jar"
          cp "$JAR" "$VJAR"
          echo "path=$VJAR" >> "$GITHUB_OUTPUT"

      # The host version goes in the notes because it is not cosmetic here: an eco extension only
      # loads into the host build it was compiled against, so "which RoyalSkyblock does this jar
      # want" is the first question anyone downloading it has.
      - name: Note the host version in the release
        if: steps.prep.outputs.release == 'true'
        run: |
          set -euo pipefail
          {
            echo ""
            echo "---"
            echo ""
            echo "Built against RoyalSkyblock \`${{ steps.host.outputs.version }}\`. Drop the jar into"
            echo "\`plugins/RoyalSkyblock/extensions/\`."
          } >> RELEASE_NOTES.md

      - name: Commit bump + changelog, tag
        if: steps.prep.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "joogiebear"
          git config user.email "joogiebear@protonmail.com"
          git add pom.xml CHANGELOG.md
          git commit -m "chore(release): ${{ steps.prep.outputs.version }}"
          git tag "${{ steps.prep.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.prep.outputs.version }}"

      - name: GitHub Release
        if: steps.prep.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prep.outputs.version }}" \
            "${{ steps.jar.outputs.path }}" \
            --title "${{ steps.prep.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
